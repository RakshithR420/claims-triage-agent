# Runs Ollama with GPU access and the triage service.
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen2.5:7b
#   docker compose up --build app
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      TRIAGE_LLM_ENABLED: "true"
    depends_on:
      - ollama

volumes:
  ollama:
